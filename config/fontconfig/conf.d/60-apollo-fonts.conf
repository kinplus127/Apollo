<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Apollo defaults.
    Text families come first. Emoji and Nerd Font symbols are weak fallbacks
    only, so Apple Color Emoji is not preferred for Latin.
    Do not enable the optional AUR file 75-apple-color-emoji.conf or
    10-nerd-font-symbols.conf: those assign or prepend icon/emoji faces.
  -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>IBM Plex Sans TC</family>
      <family>IBM Plex Sans SC</family>
      <family>IBM Plex Sans JP</family>
      <family>IBM Plex Sans KR</family>
      <family>IBM Plex Sans Arabic</family>
      <family>IBM Plex Sans Hebrew</family>
      <family>IBM Plex Sans Devanagari</family>
      <family>IBM Plex Sans Thai</family>
      <family>IBM Plex Sans Thai Looped</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>IBM Plex Serif</family>
      <family>IBM Plex Sans TC</family>
      <family>IBM Plex Sans SC</family>
      <family>IBM Plex Sans JP</family>
      <family>IBM Plex Sans KR</family>
      <family>IBM Plex Sans Arabic</family>
      <family>IBM Plex Sans Hebrew</family>
      <family>IBM Plex Sans Devanagari</family>
      <family>IBM Plex Sans Thai</family>
      <family>IBM Plex Sans Thai Looped</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noroshi Code</family>
      <family>IBM Plex Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font</string>
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
      <string>Apple Color Emoji</string>
    </edit>
  </match>
</fontconfig>
